[package]
name = "pdf-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# deflate and jpeg are the same pins as the root manifest: the png_encode target inflates what the
# PNG writer made, and the gob target builds the jpeg crate's image types.
[dependencies]
deflate = { git = "https://github.com/dobbo-ca/deflate-rs", rev = "211232f521f4378efd74f224df2fc05213cec94a" }
jpeg = { git = "https://github.com/dobbo-ca/jpeg-rs", rev = "c0cf0fcc3a5c4284bf09615cea44660247f07e99" }
libfuzzer-sys = "0.4"
pdf = { path = "../.." }

# Not part of the root package: only this crate may depend on libfuzzer-sys.
[workspace]

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_validate"
path = "fuzz_targets/read_validate.rs"
test = false
doc = false
bench = false

